name: Release plugin

on:
    push:
        tags:
            - "*"
    release:
        types: [published]

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.release.tag_name || github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Resolve release tag
              id: release-meta
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME}"
                  if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
                      tag="${{ github.event.release.tag_name }}"
                  fi

                  if [ -z "$tag" ]; then
                      echo "Could not determine the release tag." >&2
                      exit 1
                  fi

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.release-meta.outputs.tag }}

            - name: Use Node.js from Volta pin
              uses: actions/setup-node@v6
              with:
                  node-version-file: package.json
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Validate release metadata
              env:
                  RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
              run: |
                  node --input-type=module <<'EOF'
                  import { readFileSync } from "node:fs";

                  const pkg = JSON.parse(readFileSync("package.json", "utf8"));
                  const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
                  const versions = JSON.parse(readFileSync("versions.json", "utf8"));
                  const tag = process.env.RELEASE_TAG;
                  const problems = [];

                  if (pkg.version !== manifest.version) {
                      problems.push(`package.json version ${pkg.version} does not match manifest.json version ${manifest.version}.`);
                  }

                  if (tag !== pkg.version) {
                      problems.push(`Git tag ${tag} does not match package.json version ${pkg.version}.`);
                  }

                  if (tag !== manifest.version) {
                      problems.push(`Git tag ${tag} does not match manifest.json version ${manifest.version}.`);
                  }

                  if (versions[tag] !== manifest.minAppVersion) {
                      problems.push(`versions.json must map ${tag} to ${manifest.minAppVersion}.`);
                  }

                  if (problems.length > 0) {
                      console.error(problems.join("\n"));
                      process.exit(1);
                  }
                  EOF

            - name: Build plugin
              run: npm run build

            - name: Publish release assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.release-meta.outputs.tag }}
                  files: |
                      main.js
                      manifest.json
                      styles.css
                  fail_on_unmatched_files: false
                  generate_release_notes: ${{ github.event_name == 'push' }}
                  overwrite_files: true
